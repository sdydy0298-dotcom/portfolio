<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Enterprise Network 구축 범위</title>
  <desc id="overview-description">본사와 지사의 VPN 연결, ISP·IX를 통한 IDC 및 FTTH 고객망 연결을 간단히 정리한 구성도. UTM, DMZ, VPN, HA는 프로젝트의 전체 구축 범위를 나타내며 특정 장비 위치나 상세 물리 연결을 뜻하지 않습니다.</desc>
  <defs>
    <marker id="vpn-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M1 1L4 3L1 5" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .node{fill:#fff;stroke:#dbe7ff;stroke-width:2}
    .icon{fill:none;stroke:#2563eb;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    .name{fill:#172b4d;font-size:36px;font-weight:750;letter-spacing:-1px}
    .sub{fill:#42648d;font-size:24px;font-weight:500}
  </style>

  <rect width="960" height="600" fill="#f3f7ff"/>
  <path d="M0 0H960V68H0Z" fill="#fff"/>
  <rect x="42" y="23" width="5" height="24" rx="2.5" fill="#2563eb"/>
  <text x="62" y="43" fill="#172b4d" font-size="25" font-weight="700">네트워크 구축 범위</text>
  <text x="917" y="41" text-anchor="end" fill="#4c6f99" font-size="18" font-weight="600" letter-spacing="2">ENTERPRISE</text>

  <!-- Logical connectivity, kept behind every node. -->
  <g fill="none" stroke="#7fa8f3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 239V384"/>
    <path d="M746 239V384"/>
    <path d="M214 316H746"/>
  </g>
  <g fill="#2563eb" stroke="#f3f7ff" stroke-width="4">
    <circle cx="214" cy="316" r="7"/>
    <circle cx="746" cy="316" r="7"/>
  </g>
  <path d="M372 158H588" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 7" marker-start="url(#vpn-arrow)" marker-end="url(#vpn-arrow)"/>
  <rect x="431" y="135" width="98" height="46" rx="23" fill="#e5efff" stroke="#b9d2ff"/>
  <text x="480" y="166" text-anchor="middle" fill="#1d4ed8" font-size="27" font-weight="750">VPN</text>

  <!-- Headquarters -->
  <rect class="node" x="64" y="95" width="300" height="144" rx="16"/>
  <rect x="86" y="123" width="80" height="88" rx="14" fill="#eff5ff"/>
  <g class="icon">
    <path d="M105 192V141H145V192M100 192H151M119 192V179H131V192"/>
    <path d="M115 151H119M132 151H136M115 163H119M132 163H136"/>
  </g>
  <text class="name" x="185" y="160">본사</text>
  <text class="sub" x="187" y="193">HQ</text>

  <!-- Branch office -->
  <rect class="node" x="596" y="95" width="300" height="144" rx="16"/>
  <rect x="618" y="123" width="80" height="88" rx="14" fill="#eff5ff"/>
  <g class="icon">
    <path d="M637 192V150H677V192M632 192H683M651 192V179H663V192M633 150L657 135L681 150"/>
    <path d="M647 162H651M664 162H668"/>
  </g>
  <text class="name" x="717" y="160">지사</text>
  <text class="sub" x="719" y="193">Branch</text>

  <!-- Shared network boundary -->
  <rect x="386" y="279" width="188" height="74" rx="37" fill="#2563eb"/>
  <text x="480" y="327" text-anchor="middle" fill="#fff" font-size="31" font-weight="750">ISP · IX</text>

  <!-- Customer access -->
  <rect class="node" x="64" y="384" width="300" height="134" rx="16"/>
  <rect x="86" y="407" width="80" height="88" rx="14" fill="#eff5ff"/>
  <g class="icon">
    <rect x="102" y="424" width="48" height="34" rx="3"/>
    <path d="M99 469H153L148 458H104Z"/>
    <path d="M119 469H133"/>
  </g>
  <text class="name" x="185" y="444">고객망</text>
  <text class="sub" x="187" y="478">FTTH</text>

  <!-- Service infrastructure -->
  <rect x="596" y="384" width="300" height="134" rx="16" fill="#fff" stroke="#85aeff" stroke-width="2.5"/>
  <rect x="618" y="407" width="80" height="88" rx="14" fill="#e7f0ff"/>
  <g class="icon">
    <rect x="635" y="420" width="46" height="62" rx="5"/>
    <path d="M635 440H681M635 460H681M645 430H649M645 450H649M645 470H649"/>
    <path d="M664 430H672M664 450H672M664 470H672"/>
  </g>
  <text class="name" x="717" y="444">IDC</text>
  <text class="sub" x="719" y="478">Spine–Leaf</text>

  <!-- Scope labels deliberately do not assign security zones to a location. -->
  <g font-size="23" font-weight="700" text-anchor="middle">
    <rect x="230" y="548" width="104" height="34" rx="7" fill="#e5efff"/>
    <text x="282" y="573" fill="#2459ab">UTM</text>
    <rect x="350" y="548" width="104" height="34" rx="7" fill="#e5efff"/>
    <text x="402" y="573" fill="#2459ab">DMZ</text>
    <rect x="470" y="548" width="104" height="34" rx="7" fill="#e5efff"/>
    <text x="522" y="573" fill="#2459ab">VPN</text>
    <rect x="590" y="548" width="140" height="34" rx="7" fill="#fff0e8"/>
    <text x="660" y="573" fill="#b4552d">HA / VIP</text>
  </g>
</svg>
