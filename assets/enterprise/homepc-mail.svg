<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">MX1 Thunderbird 이메일 수신 검증 요약</title><desc id="d">메일 서버의 실제 Thunderbird 받은 편지함 확인 결과를 텍스트로 요약한 그림. 업로드된 원본 스크린샷의 재현 이미지가 아님.</desc><rect width="1000" height="500" rx="20" fill="#f4f7fc"/><rect x="42" y="35" width="916" height="430" rx="16" fill="#fff" stroke="#d3dfee" stroke-width="2"/><rect x="42" y="35" width="916" height="52" rx="16" fill="#e9f0ff"/><text x="75" y="70" font-family="sans-serif" font-weight="bold" font-size="22" fill="#16346c">THUNDERBIRD · MX1 수신 확인</text><rect x="72" y="109" width="254" height="304" rx="10" fill="#f3f7ff"/><text x="91" y="143" font-family="sans-serif" font-size="15" font-weight="bold" fill="#173e85">mailuser2@starmall.com</text><rect x="83" y="165" width="233" height="42" rx="7" fill="#dce8ff"/><text x="102" y="192" font-family="sans-serif" font-size="17" font-weight="bold" fill="#214fb4">받은 편지함 (1)</text><text x="91" y="235" font-family="sans-serif" font-size="15" fill="#506a91">Postfix · Dovecot</text><text x="91" y="264" font-family="sans-serif" font-size="15" fill="#506a91">SMTP → Maildir → IMAP</text><line x1="352" y1="155" x2="929" y2="155" stroke="#dbe5f2"/><text x="377" y="136" font-family="sans-serif" font-size="17" font-weight="bold" fill="#254678">mailuser1@starmall.com</text><text x="377" y="193" font-family="sans-serif" font-size="24" font-weight="bold" fill="#183469">MX1 test</text><text x="377" y="249" font-family="sans-serif" font-size="19" fill="#30486b">Hello from SMDC-MX1!</text><line x1="377" y1="273" x2="914" y2="273" stroke="#e1e8f4"/><text x="377" y="326" font-family="sans-serif" font-size="16" fill="#506a91">Windows 10 VM · Thunderbird 실제 수신 확인</text><text x="377" y="373" font-family="sans-serif" font-size="13" fill="#7c8fac">업로드된 실습 스크린샷의 확인 항목을 요약한 구성도</text></svg>